[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-test-bench"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
virtual-test-bench = "virtual_test_bench.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
